<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Pulse Account Recovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, Arial, sans-serif;
      background: #101827;
      color: #f4f7fb;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: #1c293c;
      padding: 32px;
      border-radius: 16px;
    }
    h1 { margin-top: 0; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; }
    input, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
    }
    input { border: 1px solid #718096; }
    button {
      margin-top: 22px;
      background: #60a5fa;
      color: #071526;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    a { color: #93c5fd; }
    .message { min-height: 24px; margin-top: 16px; }
    [hidden] { display: none !important; }
  </style>
  <script src="/assets/recovery.js" defer></script>
</head>
<body>
<main>
  <section id="forgot-panel" hidden>
    <h1>Forgot password?</h1>
    <p>Enter your registered email to request recovery instructions.</p>
    <form id="forgot-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button type="submit">Send reset link</button>
    </form>
    <p id="forgot-message" class="message" role="status"></p>
  </section>

  <section id="reset-panel" hidden>
    <h1>Reset your password</h1>
    <p>Choose a new password containing 12–128 characters.</p>
    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password"
             autocomplete="new-password"
             minlength="12" maxlength="128" required>
      <label for="confirmation">Confirm new password</label>
      <input id="confirmation" type="password"
             autocomplete="new-password"
             minlength="12" maxlength="128" required>
      <button id="reset-button" type="submit">Reset password</button>
    </form>
    <p id="reset-message" class="message" role="status"></p>
    <p><a href="/forgot-password">Request a new link</a></p>
  </section>
</main>
</body>
</html>
